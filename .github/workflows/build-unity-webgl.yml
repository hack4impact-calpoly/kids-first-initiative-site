name: build-unity-webgl

run-name: Build ${{ inputs.game }} WebGL from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      game:
        description: Unity game to build
        required: true
        type: choice
        options:
          - penguin-run
          - states-of-matter
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string
      promote:
        description: Open a website pull request with the built artifact
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One release per game at a time. Two concurrent promotions of the same game would race on the same
# branch and could interleave two different builds into one pull request.
concurrency:
  group: unity-webgl-${{ inputs.game }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SOURCE_REPOSITORY: ${{ inputs.game == 'penguin-run' && 'hack4impact-calpoly/kids-first-initiative-penguin-run' || 'hack4impact-calpoly/kids-first-initiative-states-of-matter' }}

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_short_sha: ${{ steps.source.outputs.short_sha }}
      unity_version: ${{ steps.source.outputs.unity_version }}

    steps:
      - name: Checkout Unity source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          path: unity-source
          fetch-depth: 0
          lfs: true

      - name: Record source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C unity-source rev-parse HEAD)"
          source_short_sha="$(git -C unity-source rev-parse --short=12 HEAD)"
          unity_version="$(awk '/m_EditorVersion:/ { print $2 }' unity-source/ProjectSettings/ProjectVersion.txt)"

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$source_short_sha" >> "$GITHUB_OUTPUT"
          echo "unity_version=$unity_version" >> "$GITHUB_OUTPUT"

          {
            echo "### Unity WebGL source"
            echo "- Game: ${{ inputs.game }}"
            echo "- Repository: $SOURCE_REPOSITORY"
            echo "- Revision: $source_sha"
            echo "- Unity: $unity_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-source/Library
          key: unity-${{ inputs.game }}-${{ steps.source.outputs.unity_version }}-webgl-${{ hashFiles('unity-source/Packages/manifest.json', 'unity-source/Packages/packages-lock.json') }}
          restore-keys: |
            unity-${{ inputs.game }}-${{ steps.source.outputs.unity_version }}-webgl-

      - name: Free disk space
        shell: bash
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Build WebGL
        id: unity_build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity-source
          unityVersion: auto
          targetPlatform: WebGL
          buildsPath: build
          buildName: WebGL
          versioning: None

      - name: Normalize WebGL artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail

          output_dir=""
          for candidate in build/WebGL build/WebGL/WebGL; do
            if [ -f "$candidate/index.html" ]; then
              output_dir="$candidate"
              break
            fi
          done

          if [ -z "$output_dir" ]; then
            echo "WebGL index.html was not found under build/."
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi

          artifact_dir="${RUNNER_TEMP}/webgl-build"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          cp -R "$output_dir"/. "$artifact_dir"/

          INDEX_PATH="$artifact_dir/index.html" BUILD_ID="$SOURCE_SHORT_SHA" node <<'NODE'
          const fs = require("node:fs");

          const indexPath = process.env.INDEX_PATH;
          const buildId = process.env.BUILD_ID;
          const assetReference =
            /(buildUrl\s*\+\s*["'][^"'?]+\.(?:loader\.js|data(?:\.(?:br|gz))?|framework\.js(?:\.(?:br|gz))?|wasm(?:\.(?:br|gz))?|symbols\.json(?:\.(?:br|gz))?))(?:\?v=[^"']*)?(["'])/g;

          let html = fs.readFileSync(indexPath, "utf8");
          let stampedAssetCount = 0;
          html = html.replace(assetReference, (_, assetPath, quote) => {
            stampedAssetCount += 1;
            return `${assetPath}?v=${encodeURIComponent(buildId)}${quote}`;
          });

          if (stampedAssetCount < 4) {
            throw new Error(`Expected at least four Unity build asset references, found ${stampedAssetCount}.`);
          }

          fs.writeFileSync(indexPath, html);
          NODE

          printf '%s\n' "$SOURCE_SHORT_SHA" > "$artifact_dir/_build_id.txt"
          printf '%s\n' "$SOURCE_SHA" > "$artifact_dir/_source_sha.txt"
          printf '%s\n' "$SOURCE_REPOSITORY" > "$artifact_dir/_source_repository.txt"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$artifact_dir/_built_at_utc.txt"

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-${{ inputs.game }}-${{ steps.source.outputs.short_sha }}
          path: ${{ runner.temp }}/webgl-build
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Open website pull request
    if: ${{ inputs.promote }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Scoped to exactly what promotion needs: push a branch and open a pull request. It deliberately
    # cannot merge, deploy, or touch production directly — a human approves the pull request.
    permissions:
      contents: write
      pull-requests: write

    env:
      GAME_DIR: ${{ inputs.game == 'penguin-run' && 'PenguinRun' || 'StatesOfMatter' }}
      SOURCE_REPOSITORY: ${{ inputs.game == 'penguin-run' && 'hack4impact-calpoly/kids-first-initiative-penguin-run' || 'hack4impact-calpoly/kids-first-initiative-states-of-matter' }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      SOURCE_SHORT_SHA: ${{ needs.build.outputs.source_short_sha }}
      UNITY_VERSION: ${{ needs.build.outputs.unity_version }}

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-${{ inputs.game }}-${{ needs.build.outputs.source_short_sha }}
          path: incoming-build

      - name: Replace the embedded build
        shell: bash
        run: |
          set -euo pipefail
          target="public/game/${GAME_DIR}"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R incoming-build/. "$target"/
          rm -rf incoming-build

      - name: Validate the promoted build
        shell: bash
        run: node scripts/validate-webgl-build.mjs "$GAME_DIR"

      - name: Confirm only this game changed
        shell: bash
        run: |
          set -euo pipefail
          # The pull request must contain the selected game and nothing else, so the diff stays
          # reviewable and a promotion cannot smuggle in an unrelated change.
          unexpected="$(git status --porcelain -- . ":(exclude)public/game/${GAME_DIR}")"
          if [ -n "$unexpected" ]; then
            echo "Promotion changed files outside public/game/${GAME_DIR}:"
            echo "$unexpected"
            exit 1
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # Deliberately the default token.
          #
          # A pull request opened with it does not start `on: pull_request` workflows — GitHub
          # suppresses them so a workflow cannot trigger itself — so the promotion pull request
          # arrives with its checks queued as "action required" and someone approves them from the
          # Actions tab. That is one click, and the runbook says to do it.
          #
          # Using UNITY_REPO_TOKEN instead was tried and reverted: that secret is present but not
          # valid, and because `||` only falls back on an empty value, git failed to authenticate and
          # no pull request was opened at all. A promotion that needs one approving click is better
          # than one that silently produces nothing.
          #
          # If someone issues a working token later, setting it here restores automatic checks.
          branch: release/${{ inputs.game }}-${{ needs.build.outputs.source_short_sha }}
          base: develop
          commit-message: "build: promote ${{ inputs.game }} WebGL ${{ needs.build.outputs.source_short_sha }}"
          title: "Promote ${{ inputs.game }} WebGL build ${{ needs.build.outputs.source_short_sha }}"
          delete-branch: true
          add-paths: public/game/${{ inputs.game == 'penguin-run' && 'PenguinRun' || 'StatesOfMatter' }}
          body: |
            Automated Unity WebGL promotion.

            | Field | Value |
            | --- | --- |
            | Game | `${{ inputs.game }}` |
            | Source repository | `${{ env.SOURCE_REPOSITORY }}` |
            | Source revision | `${{ needs.build.outputs.source_sha }}` |
            | Unity version | `${{ needs.build.outputs.unity_version }}` |
            | Build run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            The artifact was validated for a loader, framework, wasm, and data asset of plausible
            size, an `index.html` referencing the loader, and complete provenance markers. The diff
            was checked to contain only `public/game/${{ inputs.game == 'penguin-run' && 'PenguinRun' || 'StatesOfMatter' }}`.

            Merging deploys to production through Vercel. To roll back, revert the merge commit and
            confirm with `curl -s https://<site>/api/health | jq '.checks.games'`.
