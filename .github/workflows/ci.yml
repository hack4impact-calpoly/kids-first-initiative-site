name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Compile-only build and mocked tests: no Atlas or Clerk account is required.
    # Never substitute Production or Preview credentials here.
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/kfi-ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run build
        run: npm run build
      # Catches a truncated or incompletely promoted game build before it can merge, rather than
      # letting it reach a child as a blank canvas.
      - name: Validate embedded WebGL builds
        run: node scripts/validate-webgl-build.mjs

      - name: Run tests
        run: npm test

      - name: Install Playwright browser
        if: ${{ matrix.node-version == '24.x' }}
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: ${{ matrix.node-version == '24.x' }}
        run: npm run test:e2e

      # A browser failure is close to undiagnosable from the log alone. Keep the trace, screenshots,
      # and HTML report so a failure can be replayed rather than guessed at.
      # Reporting, not gating. It surfaces pre-existing accessibility violations that need a browser
      # to triage; failing the build on them would block every unrelated change and train people to
      # ignore CI. The report is uploaded either way.
      - name: Run accessibility checks
        if: ${{ matrix.node-version == '24.x' }}
        continue-on-error: true
        run: npm run test:a11y

      - name: Upload browser test artifacts
        if: ${{ always() && matrix.node-version == '24.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
